<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Rattlesnake lived at this address until October 2026. A Home Screen icon
        // added before it moved still opens here, inside the installed app, and that
        // installed app is where the lifter's workouts are stored. Send it straight
        // on to Rattlesnake. Do not remove this: see README.md.
        if (navigator.standalone === true ||
            matchMedia("(display-mode: standalone)").matches ||
            matchMedia("(display-mode: fullscreen)").matches) {
            location.replace("/rattlesnake/");
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Free apps by Mattan Kama: Rattlesnake, Intonation and the SAT Regression Trainer.">
    <title>Mattan Kama</title>
    <link rel="icon" href="data:,">
    <link rel="preload" href="fonts/SourceSans3-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face {
            font-family: "Source Sans 3";
            src: url("fonts/SourceSans3-Variable.woff2") format("woff2");
            font-weight: 200 900;
            font-display: swap;
        }

        /* Georgia where it's installed; Gelasio, its metric-compatible stand-in, elsewhere. */
        @font-face {
            font-family: "Gelasio";
            src: url("fonts/Gelasio-Regular.woff2") format("woff2");
            font-weight: 400;
            font-display: swap;
        }

        :root {
            --canvas: #ffffff;
            --canvas-soft: #fbf9f8;
            --canvas-warm: #f1efed;
            --hairline: #e4e1dd;
            --ink: #161513;
            --ink-wash-8: rgba(22, 21, 19, .08);
            --accent-gold: #f0cc71;
            --focus: #227e9e;
            --sans: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
            --serif: Georgia, "Gelasio", "Times New Roman", serif;
            --gutter: clamp(20px, 5vw, 72px);
            --content: 1200px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--canvas-soft);
            color: var(--ink);
            font: 400 16px/1.4 var(--sans);
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
        }

        a { color: var(--ink); text-decoration: none; }

        a:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        .container {
            max-width: var(--content);
            margin: 0 auto;
            padding: 0 var(--gutter);
            box-sizing: content-box;
        }

        .hero {
            background: var(--canvas-warm);
            padding: 48px 0 96px;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 48px), 0 100%);
        }

        h1 {
            margin: 0;
            font: 400 56px/1.2 var(--serif);
            text-wrap: balance;
        }

        .rule {
            width: 40px;
            height: 4px;
            margin: 18px 0 24px;
            background: var(--accent-gold);
        }

        main { padding: 48px 0; }

        .apps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
            gap: 32px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .app {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
            padding: 24px;
            border-radius: 8px;
            background: var(--canvas);
        }

        .mark {
            display: block;
            width: 56px;
            height: 56px;
            overflow: hidden;
            border: 1px solid var(--hairline);
            border-radius: 8px;
        }

        .mark svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .row {
            margin-top: auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h2 {
            margin: 0;
            font: 800 20px/1.2 var(--sans);
        }

        h2 a { transition: opacity 120ms ease; }
        h2 a:hover { opacity: .6; }

        .source {
            display: inline-flex;
            align-items: center;
            margin-left: auto;
            padding: 10px 16px;
            border: 1px solid var(--ink);
            border-radius: 4px;
            font: 500 14px/16.8px var(--sans);
            white-space: nowrap;
            transition: background-color 120ms ease;
        }

        .source:hover { background: var(--ink-wash-8); }

        footer {
            margin-top: auto;
            padding: 20px 0;
            background: var(--canvas);
        }

        footer a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 12px 0;
            font: 400 12px/20px var(--sans);
        }

        footer a:hover { text-decoration: underline; text-underline-offset: 3px; }
    </style>
</head>
<body>
<header class="hero">
    <div class="container">
        <h1>Mattan Kama</h1>
        <div class="rule" aria-hidden="true"></div>
    </div>
</header>

<main>
    <div class="container">
        <ul class="apps">
            <li>
                <article class="app">
                    <div class="mark" aria-hidden="true">
                        <!-- Rattlesnake's own app icon -->
                        <svg viewBox="0 0 512 512">
                            <rect width="512" height="512" fill="#191D24"/>
                            <g stroke-linecap="round" stroke-linejoin="round" fill="none">
                                <path d="M 330 330 C 356 346, 378 358, 398 368" stroke="#B87D4B" stroke-width="38"/>
                                <path d="M 384 360 C 396 366, 406 372, 415 377" stroke="#B87D4B" stroke-width="26"/>
                                <path d="M 372 186 C 372 126, 306 112, 266 150 C 226 188, 254 246, 284 276 C 318 310, 310 374, 242 390 C 168 404, 106 364, 110 306 C 114 250, 170 228, 218 246 C 268 264, 300 302, 336 332" stroke="#B87D4B" stroke-width="54"/>
                                <path d="M 372 186 C 372 126, 306 112, 266 150 C 226 188, 254 246, 284 276 C 318 310, 310 374, 242 390 C 168 404, 106 364, 110 306 C 114 250, 170 228, 218 246 C 268 264, 300 302, 336 332" stroke="#191D24" stroke-width="26" stroke-dasharray="22 48" stroke-dashoffset="44"/>
                            </g>
                            <g transform="rotate(-16 380 176)">
                                <ellipse cx="380" cy="176" rx="42" ry="31" fill="#B87D4B"/>
                                <circle cx="400" cy="166" r="8" fill="#191D24"/>
                            </g>
                            <g fill="#799496">
                                <ellipse cx="425" cy="383" rx="16" ry="13" transform="rotate(30 425 383)"/>
                                <ellipse cx="444" cy="395" rx="13" ry="10" transform="rotate(30 444 395)"/>
                                <ellipse cx="459" cy="405" rx="10" ry="8" transform="rotate(30 459 405)"/>
                            </g>
                        </svg>
                    </div>
                    <div class="row">
                        <h2><a href="/rattlesnake/">Rattlesnake</a></h2>
                        <a class="source" href="https://github.com/mattankama/rattlesnake">Source code</a>
                    </div>
                </article>
            </li>

            <li>
                <article class="app">
                    <div class="mark" aria-hidden="true">
                        <!-- Two tones a little apart: the beating the Labs are about -->
                        <svg viewBox="0 0 56 56" fill="none" stroke-linecap="round">
                            <rect width="56" height="56" fill="#ffffff"/>
                            <path d="M8 28 C10.4 20 12.3 20 14.7 28 S19 36 21.3 28 S25.7 20 28 28 S32.3 36 34.7 28 S39 20 41.3 28 S45.7 36 48 28" stroke="#c74634" stroke-width="2.4" opacity="0.4"/>
                            <path d="M8 28 C11.6 16 14.4 16 18 28 S24.4 40 28 28 S34.4 16 38 28 S44.4 40 48 28" stroke="#c74634" stroke-width="2.6"/>
                        </svg>
                    </div>
                    <div class="row">
                        <h2><a href="/intonation/">Intonation</a></h2>
                        <a class="source" href="https://github.com/mattankama/intonation">Source code</a>
                    </div>
                </article>
            </li>

            <li>
                <article class="app">
                    <div class="mark" aria-hidden="true">
                        <!-- Points and the regression curve through them -->
                        <svg viewBox="0 0 56 56" fill="none">
                            <rect width="56" height="56" fill="#ffffff"/>
                            <g stroke="#e4e1dd" stroke-width="1">
                                <path d="M0 14H56M0 28H56M0 42H56M14 0V56M28 0V56M42 0V56"/>
                            </g>
                            <path d="M7 46 C22 44 34 36 49 9" stroke="#004d96" stroke-width="2.4" stroke-linecap="round"/>
                            <g fill="#004d96">
                                <circle cx="11" cy="42" r="2.6"/>
                                <circle cx="18" cy="44" r="2.6"/>
                                <circle cx="25" cy="38" r="2.6"/>
                                <circle cx="32" cy="35" r="2.6"/>
                                <circle cx="38" cy="25" r="2.6"/>
                                <circle cx="45" cy="19" r="2.6"/>
                            </g>
                        </svg>
                    </div>
                    <div class="row">
                        <h2><a href="/DesmosRegressionTrainerExpanded/">SAT Regression Trainer</a></h2>
                        <a class="source" href="https://github.com/mattankama/DesmosRegressionTrainerExpanded">Source code</a>
                    </div>
                </article>
            </li>
        </ul>
    </div>
</main>

<footer>
    <div class="container">
        <a href="https://github.com/mattankama">
            <!-- Lucide "github" icon, ISC licence -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
            GitHub
        </a>
    </div>
</footer>
</body>
</html>
