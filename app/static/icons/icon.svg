<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Rattlesnake">
  <title>Rattlesnake</title>
  <rect width="512" height="512" fill="#191D24"/>
  <defs>
    <path id="rs-body"
          d="M 372 186
             C 372 126, 306 112, 266 150
             C 226 188, 254 246, 284 276
             C 318 310, 310 374, 242 390
             C 168 404, 106 364, 110 306
             C 114 250, 170 228, 218 246
             C 268 264, 300 302, 336 332"/>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- tail taper into the rattle -->
    <path d="M 330 330 C 356 346, 378 358, 398 368" stroke="#B87D4B" stroke-width="38"/>
    <path d="M 384 360 C 396 366, 406 372, 415 377" stroke="#B87D4B" stroke-width="26"/>
    <!-- body -->
    <use href="#rs-body" stroke="#B87D4B" stroke-width="54"/>
    <!-- dorsal blotches: identical geometry, narrower dashed Surface stroke -->
    <use href="#rs-body" stroke="#191D24" stroke-width="26" stroke-dasharray="22 48" stroke-dashoffset="44"/>
  </g>
  <!-- head: just over body width, tilted nose-down to the right -->
  <g transform="rotate(-16 380 176)">
    <ellipse cx="380" cy="176" rx="42" ry="31" fill="#B87D4B"/>
    <circle cx="400" cy="166" r="8" fill="#191D24"/>
  </g>
  <!-- rattle, within the maskable safe zone -->
  <g fill="#799496">
    <ellipse cx="425" cy="383" rx="16" ry="13" transform="rotate(30 425 383)"/>
    <ellipse cx="444" cy="395" rx="13" ry="10" transform="rotate(30 444 395)"/>
    <ellipse cx="459" cy="405" rx="10" ry="8"  transform="rotate(30 459 405)"/>
  </g>
</svg>
