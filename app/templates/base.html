<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0F0E0D">
    <meta name="description" content="Rattlesnake — weightlifting workout tracker">

    <title>{% block title %}Rattlesnake{% endblock %}</title>

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/favicon.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rattlesnake">

    <!-- One variable family, two axes (weight 100-900, width 62-125%).
         Width carries hierarchy, so there is nothing else to load. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="{{ url_for('static', filename='fonts/archivo-latin-var.woff2') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Ambient heat: one soft field behind everything, so the canvas reads as
         a lit space rather than a flat black sheet. -->
    <div class="aura" aria-hidden="true"></div>

    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
