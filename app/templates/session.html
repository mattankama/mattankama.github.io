{% extends "base.html" %}
{% block title %}Session — Rattlesnake{% endblock %}

{% block content %}
<!-- The rest timer floats over the content on glass rather than sitting in a
     bar above it, so the sets you are reading never lose vertical space. -->
<div class="timer-bar" id="timer-bar">
    <div class="timer-shell">
        <span class="timer-label">Rest</span>
        <span class="timer-display" id="timer-display" role="timer" aria-live="off">00:00</span>
    </div>
</div>

<!-- Scrollable exercise list -->
<div class="session-content" id="session-content">
    <div class="session-header">
        <h1 class="session-title" id="session-title">Session</h1>
    </div>

    <div id="entries-list" class="entries-list">
        <!-- Populated by JS -->
    </div>
</div>

<!-- Complete Session: pinned to the bottom on the same glass as the timer. -->
<div class="complete-bar">
    <button class="btn btn-primary" id="complete-session-btn">Complete Session</button>
</div>

<script>
    // Which session, from `/session/?id=45`. See routine.html for why.
    (function () {
        const id = new URLSearchParams(location.search).get("id");
        window.SESSION_ID = id && /^\d+$/.test(id) ? Number(id) : null;
    })();
</script>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/reorder.js') }}"></script>
<script src="{{ url_for('static', filename='js/session.js') }}"></script>
{% endblock %}
