{% extends "base.html" %}
{% block title %}Session — Rattlesnake{% endblock %}

{% block content %}
<!-- Sticky rest timer (top anchor, §5) -->
<div class="timer-bar" id="timer-bar">
    <span class="timer-display" id="timer-display" role="timer" aria-live="off">00:00</span>
</div>

<!-- Scrollable exercise list -->
<div class="session-content" id="session-content">
    <div class="session-header">
        <h1 class="session-title" id="session-title">Session</h1>
    </div>

    <div id="entries-list" class="entries-list">
        <!-- Populated by JS -->
    </div>

    <p class="sets-hint">Swipe a set left to delete it.</p>
</div>

<!-- Complete Session: pinned to the bottom, full width (§5). No accent —
     Copper is reserved for the running rest timer. -->
<div class="complete-bar">
    <button class="btn btn-primary" id="complete-session-btn">Complete Session</button>
</div>

<script>window.SESSION_ID = {{ session_id }};</script>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/session.js') }}"></script>
{% endblock %}
